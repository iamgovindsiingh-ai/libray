<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexShelf · Student Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Plus Jakarta Sans", sans-serif;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(79, 70, 229, 0.25) 0%, transparent 70%);
        top: -150px;
        left: -150px;
        border-radius: 50%;
      }
      body::after {
        content: "";
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, transparent 70%);
        bottom: -100px;
        right: -100px;
        border-radius: 50%;
      }

      .register-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 460px;
      }

      .register-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 24px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }

      .card-header {
        background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        padding: 32px 24px;
        text-align: center;
        color: white;
      }

      .card-header h3 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 6px;
      }

      .card-body { padding: 32px; }

      .form-label {
        font-weight: 700;
        color: #334155;
        margin-bottom: 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .form-control {
        border: 1.5px solid #cbd5e1;
        border-radius: 10px;
        padding: 11px 14px;
        font-size: 14px;
        transition: all 0.25s ease;
      }

      .form-control:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      }

      .btn-register {
        width: 100%;
        padding: 13px 20px;
        background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
        border: none;
        border-radius: 10px;
        color: white;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 10px 25px rgba(79, 70, 229, 0.35);
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      .btn-register:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(79, 70, 229, 0.45); }
    </style>
  </head>
  <body>
    <div class="register-container">
      <div class="register-card">
        <div class="card-header">
          <i class="fas fa-id-card-clip text-warning fs-1 mb-2"></i>
          <h3>Join NexShelf</h3>
          <p class="mb-0 opacity-75 small">Create your digital student library membership</p>
        </div>

        <div class="card-body">
          <div id="registerMessage" class="alert d-none" role="alert"></div>

          <form id="registerForm" class="row g-3">
            <div class="col-12">
              <label class="form-label"><i class="fas fa-user me-1 text-primary"></i>Full Name</label>
              <input type="text" id="full_name" class="form-control" placeholder="e.g. Alex Johnson" required />
            </div>
            <div class="col-12">
              <label class="form-label"><i class="fas fa-envelope me-1 text-primary"></i>College Email</label>
              <input type="email" id="email" class="form-control" placeholder="student@nexshelf.edu" required />
            </div>
            <div class="col-12">
              <label class="form-label"><i class="fas fa-lock me-1 text-primary"></i>Password</label>
              <input type="password" id="password" class="form-control" placeholder="••••••••" required />
            </div>
            <div class="col-12">
              <button type="submit" class="btn-register">
                <span id="btnText">Create Student Account</span>
              </button>
            </div>
          </form>

          <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top small">
            <span class="text-muted">Already registered? <a href="/login" class="fw-bold text-primary text-decoration-none">Sign In</a></span>
            <a href="/contact" class="text-secondary text-decoration-none fw-semibold"><i class="fas fa-headset me-1 text-primary"></i>Contact Desk</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      const registerForm = document.getElementById("registerForm");
      const registerMessage = document.getElementById("registerMessage");
      const btnText = document.getElementById("btnText");

      registerForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        const full_name = document.getElementById("full_name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        btnText.textContent = "Creating Account…";
        registerForm.querySelector(".btn-register").disabled = true;

        try {
          const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ full_name, email, password, role: "student" }),
          });
          const data = await response.json();

          if (!response.ok || !data.user) {
            registerMessage.className = "alert alert-danger py-2 small";
            registerMessage.textContent = data.error || "Registration failed.";
            registerMessage.classList.remove("d-none");
            btnText.textContent = "Create Student Account";
            registerForm.querySelector(".btn-register").disabled = false;
            return;
          }

          registerMessage.className = "alert alert-success py-2 small";
          registerMessage.textContent = "✓ Account created! Redirecting to login…";
          registerMessage.classList.remove("d-none");

          setTimeout(() => { window.location.href = "/login"; }, 1000);
        } catch (error) {
          registerMessage.className = "alert alert-danger py-2 small";
          registerMessage.textContent = "Unable to connect to server.";
          registerMessage.classList.remove("d-none");
          btnText.textContent = "Create Student Account";
          registerForm.querySelector(".btn-register").disabled = false;
        }
      });
    </script>
  </body>
</html>
