<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexShelf · Access Portal</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Plus Jakarta Sans", sans-serif;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      /* Ambient floating glow circles */
      body::before {
        content: "";
        position: absolute;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(79, 70, 229, 0.25) 0%, transparent 70%);
        top: -150px;
        left: -150px;
        border-radius: 50%;
      }
      body::after {
        content: "";
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, transparent 70%);
        bottom: -100px;
        right: -100px;
        border-radius: 50%;
      }

      .login-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 440px;
      }

      .login-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 24px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }

      .card-header {
        background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        padding: 36px 24px;
        text-align: center;
        color: white;
      }

      .card-header h2 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
      }

      .card-body { padding: 36px; }

      .form-label {
        font-weight: 700;
        color: #334155;
        margin-bottom: 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .form-control {
        border: 1.5px solid #cbd5e1;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 14px;
        transition: all 0.25s ease;
      }

      .form-control:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      }

      .btn-login {
        width: 100%;
        padding: 14px 20px;
        background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
        border: none;
        border-radius: 10px;
        color: white;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 10px 25px rgba(79, 70, 229, 0.35);
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      .btn-login:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(79, 70, 229, 0.45); }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="card-header">
          <i class="fas fa-book-sparkles text-warning fs-1 mb-2"></i>
          <h2>NexShelf</h2>
          <p class="mb-0 opacity-75 small">Next-Gen Smart Library Management System</p>
        </div>

        <div class="card-body">
          <div id="loginMessage" class="alert d-none" role="alert"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label"><i class="fas fa-envelope me-1 text-primary"></i>Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="student@college.edu" required />
            </div>
            <div class="mb-4">
              <label for="password" class="form-label"><i class="fas fa-lock me-1 text-primary"></i>Password</label>
              <input type="password" class="form-control" id="password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn-login">
              <span id="btnText">Sign In</span>
            </button>
          </form>

          <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top small">
            <span class="text-muted">Need a card? <a href="/register" class="fw-bold text-primary text-decoration-none">Sign up</a></span>
            <a href="/contact" class="text-secondary text-decoration-none fw-semibold"><i class="fas fa-headset me-1 text-primary"></i>Contact Desk</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");
      const loginMessage = document.getElementById("loginMessage");
      const btnText = document.getElementById("btnText");

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        btnText.textContent = "Authenticating…";
        loginForm.querySelector(".btn-login").disabled = true;

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await response.json();

          if (!response.ok || !data.token) {
            loginMessage.className = "alert alert-danger py-2 small";
            loginMessage.textContent = data.error || "Login failed.";
            loginMessage.classList.remove("d-none");
            btnText.textContent = "Sign In";
            loginForm.querySelector(".btn-login").disabled = false;
            return;
          }

          localStorage.setItem("token", data.token);
          localStorage.setItem("userRole", data.user.role);

          loginMessage.className = "alert alert-success py-2 small";
          loginMessage.textContent = "✓ Access granted! Redirecting…";
          loginMessage.classList.remove("d-none");

          setTimeout(() => {
            window.location.href = data.user.role === "admin" ? "/admin" : "/student";
          }, 600);
        } catch (error) {
          loginMessage.className = "alert alert-danger py-2 small";
          loginMessage.textContent = "Unable to connect to server.";
          loginMessage.classList.remove("d-none");
          btnText.textContent = "Sign In";
          loginForm.querySelector(".btn-login").disabled = false;
        }
      });
    </script>
  </body>
</html>
