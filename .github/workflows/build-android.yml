name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build NexShelf Android APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Java 21 (Temurin distribution required by Capacitor 8 & compileSdk 36)
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x frontend/android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Step 3: Setup Node.js 22 (Enforced for Capacitor 8 CLI)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Step 4: Verify Node.js and npm Runtime Environment
      - name: Verify Node.js Runtime
        working-directory: frontend
        run: |
          echo "=== Verifying Node.js Runtime ==="
          node --version
          npm --version
          which node

      # Step 5: Install Frontend Dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # Step 6: Verify Installed Capacitor CLI and Core Plugins
      - name: Verify Capacitor Dependencies & CLI
        working-directory: frontend
        run: |
          echo "=== Verifying Capacitor Dependencies & CLI ==="
          npm ls @capacitor/cli @capacitor/core @capacitor/android
          npx --no-install cap --version

      # Step 7: Build React Frontend
      - name: Build React Frontend
        working-directory: frontend
        run: npm run build

      # Step 8: Verify configured WebDir (dist)
      - name: Verify WebDir (dist)
        working-directory: frontend
        run: |
          echo "=== Checking configured webDir ==="
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "::error::WebDir 'dist' or 'dist/index.html' does not exist!"
            exit 1
          fi
          echo "WebDir verified successfully:"
          ls -la dist/

      # Step 9: Disable Capacitor Telemetry
      - name: Disable Capacitor Telemetry
        working-directory: frontend
        run: npx cap telemetry off

      # Step 10: Run Capacitor Sync Android
      - name: Run Capacitor Sync Android
        working-directory: frontend
        run: npx cap sync android --inline

      # Step 11: Verify Android Configuration Files
      - name: Verify Android Configuration
        working-directory: frontend
        run: |
          echo "=== Verifying Essential Capacitor Android Files ==="
          test -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" || {
            echo "::error::Missing android/capacitor-cordova-android-plugins/cordova.variables.gradle!"
            exit 1
          }
          test -f "android/capacitor.settings.gradle" || {
            echo "::error::Missing android/capacitor.settings.gradle!"
            exit 1
          }
          test -f "android/app/capacitor.build.gradle" || {
            echo "::error::Missing android/app/capacitor.build.gradle!"
            exit 1
          }
          echo "All essential Capacitor Android configuration files verified successfully."

      # Step 12: Run Gradle assembleDebug
      - name: Run Gradle assembleDebug
        working-directory: frontend/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Step 13: Locate and Upload generated APK
      - name: Locate and Prepare APK
        run: |
          mkdir -p release-apk
          echo "=== Locating generated APK ==="
          APK_FILE=$(find frontend/android/app/build/outputs/apk -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find frontend/android -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "SUCCESS: Found APK at $APK_FILE"
            cp -v "$APK_FILE" release-apk/NexShelf-v1.0.0.apk
            ls -lh release-apk/NexShelf-v1.0.0.apk
          else
            echo "::error::No APK file generated! Listing frontend/android contents:"
            ls -laR frontend/android/app/build || true
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NexShelf-v1.0.0-APK
          path: release-apk/NexShelf-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
