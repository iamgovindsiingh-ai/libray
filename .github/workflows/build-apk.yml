name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build NexShelf Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Grant Execute Permission to Gradlew
        run: chmod +x frontend/android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web & Native Android Assets
        working-directory: frontend
        run: npm run build

      - name: Build Debug APK with Gradle
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Print Gradle Log on Failure
        if: failure()
        run: tail -n 120 frontend/android/gradle-build.log

      - name: Locate and Prepare APK
        run: |
          mkdir -p release-apk
          APK_FILE=$(find frontend/android -name "*debug*.apk" -o -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-apk/NexShelf-v1.0.0.apk
            ls -lh release-apk/
          else
            echo "::error::No APK file generated by Gradle build!"
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NexShelf-Android-App-APK
          path: release-apk/NexShelf-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
