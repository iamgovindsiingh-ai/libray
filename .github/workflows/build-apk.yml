name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build NexShelf Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Grant Execute Permission to Gradlew
        run: chmod +x frontend/android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web & Native Android Assets
        working-directory: frontend
        run: npm run build

      - name: Build Debug APK with Gradle
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK
        run: |
          mkdir -p release-apk
          find . -type f -name "*.apk" -exec cp -v {} release-apk/NexShelf-v1.0.0.apk \;
          ls -lh release-apk/

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NexShelf-v1.0.0-APK
          path: release-apk/NexShelf-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
