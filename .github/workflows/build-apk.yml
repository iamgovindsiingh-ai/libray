name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build NexShelf Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Grant Execute Permission to Gradlew
        run: chmod +x frontend/android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Production Assets
        working-directory: frontend
        run: npm run build

      - name: Verify WebDir (dist)
        working-directory: frontend
        run: |
          echo "Checking configured webDir..."
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "::error::WebDir 'dist' or 'dist/index.html' does not exist!"
            exit 1
          fi
          echo "WebDir verified successfully:"
          ls -la dist/

      - name: Run Capacitor Sync Android
        working-directory: frontend
        run: |
          npx cap telemetry off || true
          npx cap sync android --inline

      - name: Verify Capacitor Android Gradle Files
        working-directory: frontend
        run: |
          echo "Verifying essential Capacitor Android Gradle files..."
          test -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" || {
            echo "::error::Missing android/capacitor-cordova-android-plugins/cordova.variables.gradle!"
            exit 1
          }
          test -f "android/capacitor.settings.gradle" || {
            echo "::error::Missing android/capacitor.settings.gradle!"
            exit 1
          }
          test -f "android/app/capacitor.build.gradle" || {
            echo "::error::Missing android/app/capacitor.build.gradle!"
            exit 1
          }
          echo "All essential Capacitor Gradle files verified successfully."

      - name: Build Debug APK with Gradle
        working-directory: frontend/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../../gradle-build.log || {
            echo "::error::Gradle compilation failed!"
            tail -n 120 ../../gradle-build.log
            exit 1
          }

      - name: Locate and Prepare APK
        run: |
          mkdir -p release-apk
          echo "Locating generated APK..."
          APK_FILE=$(find frontend/android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp -v "$APK_FILE" release-apk/NexShelf-v1.0.0.apk
            ls -lh release-apk/NexShelf-v1.0.0.apk
          else
            echo "::error::No APK file generated by Gradle build!"
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NexShelf-v1.0.0-APK
          path: release-apk/NexShelf-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
